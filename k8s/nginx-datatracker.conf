upstream datatracker_backend {
    server 127.0.0.1:8000;
    keepalive 0; # default = 32 since nginx 1.29.7
}

# Cloudflare gives us the client address; $remote_addr is the in-cluster peer.
map $${keepempty}http_cf_connecting_ip $${keepempty}client_addr {
    ""      $${keepempty}remote_addr;
    default $${keepempty}http_cf_connecting_ip;
}

# Requests whose responses are expensive enough that one client can exhaust the
# worker pool with a handful of them in flight. An empty key means "not limited",
# so everything not matched here is unaffected.
map $${keepempty}uri $${keepempty}expensive_client {
    default    "";
    ~^/person/ $${keepempty}client_addr;
    ~^/api/v1/ $${keepempty}client_addr;
}

limit_conn_zone $${keepempty}expensive_client zone=expensive_conn:10m;
limit_req_zone  $${keepempty}expensive_client zone=expensive_req:10m rate=10r/s;

server {
    listen 8080 default_server;
    server_name _;

    # Replace default "main" formatter with the ietfjson formatter from nginx-logging.conf
    access_log  /var/log/nginx/access.log  ietfjson;

    location /health/nginx {
        access_log off;
        return 200;
    }

    location /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /doc/pdf/\n";
    }

    location / {
        # A single client may hold at most 4 of the pool's worker slots on the
        # expensive prefixes; the rate cap is loose enough for interactive use.
        limit_conn expensive_conn 4;
        limit_req zone=expensive_req burst=20 nodelay;
        limit_conn_status 429;
        limit_req_status 429;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' data: https://datatracker.ietf.org/ https://www.ietf.org/ http://ietf.org/ https://analytics.ietf.org https://static.ietf.org; frame-ancestors 'self' ietf.org *.ietf.org meetecho.com *.meetecho.com";
        proxy_set_header Host $${keepempty}host;
        proxy_set_header Connection close;
        proxy_set_header X-Request-Start "t=$${keepempty}msec";
        proxy_set_header X-Forwarded-For $${keepempty}proxy_add_x_forwarded_for;
        proxy_hide_header X-Datatracker-Is-Authenticated; # hide this from the outside world
        proxy_pass http://datatracker_backend;
        # Set timeouts longer than Cloudflare proxy limits
        proxy_connect_timeout 60;  # nginx default (Cf = 15)
        proxy_read_timeout 120;  # nginx default = 60 (Cf = 100) 
        proxy_send_timeout 60;  # nginx default = 60 (Cf = 30)
        client_max_body_size 0;  # disable size check
    }
}
